plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
  
}

def envPropertiesFile = rootProject.file("../.env")
def envProperties = new Properties()
if (envPropertiesFile.exists()) {
    envPropertiesFile.withReader('UTF-8') { reader ->
        envProperties.load(reader)
    }
}

android {
    namespace "com.seed4va.mywellness"
    compileSdk flutter.compileSdkVersion
    
    defaultConfig {
        applicationId "com.seed4va.mywellness"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        
        // Add applicationName placeholder
        manifestPlaceholders = [
            applicationName: "io.flutter.app.FlutterApplication",
            mapsApiKey: envProperties.getProperty("GOOGLE_MAPS_API_KEY_ANDROID", "")
        ]
        resValue "string", "MAPS_API_KEY", envProperties.getProperty("GOOGLE_MAPS_API_KEY_ANDROID", "")
    }
    
 buildTypes {
    release {
        signingConfig signingConfigs.debug
        minifyEnabled false    // ← disable completely
        shrinkResources false  // ← disable this too
    }
}

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
}

flutter {
    source '../..'
}
