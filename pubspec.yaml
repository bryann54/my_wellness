name: my_wellness
description: Private preventive-health companion for My Wellness members.
publish_to: none
version: 1.1.4+9

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  json_annotation: ^4.9.0 
  # UI and asset management
  google_fonts: ^8.2.1
  shimmer: ^4.0.0
  cached_network_image: ^4.0.3
  flutter_animate: ^4.5.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  local_auth: ^3.0.2
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.0
  map_launcher: ^7.0.0
  geolocator: ^14.0.2 
  geocoding: ^5.0.0 
  intl: ^0.20.2
  flutter_image_compress: ^2.1.0
  path: ^1.9.0
  path_provider: ^2.1.2
  camera: ^0.12.1
  collection: ^1.18.0
  video_player: ^2.8.6
  chewie: ^1.8.5
  onesignal_flutter: ^5.1.2
  google_maps_flutter: ^2.10.0
  permission_handler: ^12.0.1
  
  # State Management, DI, and Architecture
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dartz: ^0.10.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  auto_route: ^11.1.0
  shared_preferences: ^2.5.3
  bloc_concurrency: ^0.3.0
  
  # Networking and Security
  dio: ^5.4.3+1
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.0
  flashy_tab_bar2: ^0.0.10
  webview_flutter: ^4.13.0
  flutter_contacts: ^2.6.0
  package_info_plus: ^10.2.2
  connectivity_plus: ^7.3.1
  file_picker: ^13.1.0
  phosphor_icons: ^3.0.1
  flutter_tts: ^4.2.5
  bloc: ^9.2.1
  # purchases_flutter: ^9.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  
  
  # Code Generators (dev_dependencies)
  build_runner: ^2.4.9
  injectable_generator: ^3.1.3
  auto_route_generator: ^10.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - env/
    - assets/images/
    - assets/lang/en.json
    - assets/lang/sw.json
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/AppIcons (21)/android/playstore-icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#008080"
  adaptive_icon_foreground: "assets/AppIcons (21)/android/playstore-icon.png"
  min_sdk_android: 21
